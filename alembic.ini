# A minimal Alembic configuration for this project
[alembic]
script_location = migrations
# The URL comes from env.py's get_url(), which reads $DATABASE_URL.  Leave this
# blank: configparser evaluates "%(DATABASE_URL)s" as an interpolation against
# the ini's own options, finds no such option, and raises
# InterpolationMissingOptionError before env.py ever gets to override it — so
# the alembic CLI could not start at all.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

